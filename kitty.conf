# vim:ft=kitty:fdm=marker

# -- [Font] ------------------------------------------------------------- {{{
# NOTE: this was commented out, so kitty silently fell back to the generic
# `monospace` family -- which also made `disable_ligatures` below a no-op.
# All four styles resolve from ~/Library/Fonts.
font_family                     family="psudoFont Liga Mono"
bold_font                       auto
italic_font                     auto
bold_italic_font                auto
disable_ligatures               cursor
font_size                       12.0
force_ltr                       yes
modify_font                     cell_height 100%
modify_font                     underline_position 100%
modify_font                     underline_thickness 1.00
# }}}

# --[ cursor ] ------------------------------------------------------------- {{{
# cursor                          none
cursor_stop_blinking_after      10.0
cursor_trail                    0
pointer_shape_when_dragging     hand
# }}}

# --[ mouse ] -------------------------------------------------------------- {{{
copy_on_select                  yes
focus_follows_mouse             no
mouse_hide_wait                 15
mouse_map                       cmd+left click grabbed,ungrabbed mouse_handle_click selection link prompt
mouse_map                       cmd+left release ungrabbed pass_selection_to_program /usr/bin/open
scrollback_lines                20000
# NOTE: `rectangle_select_modifiers ctrl+alt` and `terminal_select_modifiers
# shift` used to live here. Both were removed from kitty and were silently
# ignored -- and both behaviours are now built-in defaults anyway, so there is
# nothing to replace them with.
# }}}

# --[ windows ] ------------------------------------------------------------ {{{
enabled_layouts                 grid
hide_window_decorations         titlebar-only
placement_strategy              top-left
remember_window_size            yes
window_border_width             1.0
window_margin_width             0.0
window_padding_width            0 5 0
# }}}

# --[ tabs ] --------------------------------------------------------------- {{{
active_tab_font_style           bold-italic
bell_on_tab                     no
inactive_tab_font_style         normal
tab_activity_symbol             none
tab_bar_align                   left
tab_bar_edge                    bottom
tab_bar_margin_height           0.0 0.0
tab_bar_margin_width            0.0
tab_bar_min_tabs                1
tab_bar_style                   custom
tab_fade                        0 0 0 0
tab_separator                   ""
# NOTE: the elide test used to be `title.rindex(title[-1]) + 1 > 25`, which is
# just a roundabout `len(title)` -- the last character's last index is always
# len-1 -- except that it raised IndexError on an empty title. `len()` is both
# clearer and safe.
tab_title_template              " {index}:{f'{title[:6]}…{title[-6:]}' if len(title) > 25 else title}{' []' if layout_name == 'stack' else ''} "
active_tab_title_template       " {index}:{f'{title[:6]}…{title[-6:]}' if len(title) > 25 else title}{' []' if layout_name == 'stack' else ''} "
# }}}

# --[ theme ] ----------------------------------------------------------- {{{
include current-theme.conf
# }}}

# --[ os-specific ] -------------------------------------------------------- {{{
draw_minimal_borders                    yes
macos_colorspace                        displayp3
macos_custom_beam_cursor                yes
macos_hide_from_tasks                   no
macos_option_as_alt                     no
macos_quit_when_last_window_closed      yes
macos_show_window_title_in              window
macos_thicken_font                      0.25
macos_traditional_fullscreen            no
# }}}

# --[ misc ] --------------------------------------------------------------- {{{
allow_hyperlinks                      yes
background_opacity                    0.9
clipboard_control                     write-clipboard write-primary read-clipboard-ask read-primary-ask
close_on_child_death                  yes
dynamic_background_opacity            yes
open_url_with                         default
# NOTE: was pointed at ~/.dotfiles/config/nvim/vimrc, which does not exist (nor
# does ~/.dotfiles), so the pager failed to open. `-u NONE` keeps it plugin-free
# and independent of the main nvim config.
scrollback_pager                      nvim -u NONE -c "syntax on|set t_Co=256|set termguicolors|setlocal nomodifiable nonumber nolist showtabline=0 foldcolumn=0 ft=man|colorscheme habamax|hi Normal guifg=#bcbcbc guibg=NONE gui=NONE cterm=NONE" -c "autocmd VimEnter * cnoremap q q!|nnoremap q :q!<CR>|normal G" -c "silent write! /tmp/kitty_scrollback_buffer | te cat /tmp/kitty_scrollback_buffer - "
select_by_word_characters             @-./_~?&=%+#
# NOTE: was an absolute path under /Users/paloth -- a different user -- so the
# startup session never loaded. Relative paths resolve against the config dir.
startup_session                       session.conf
strip_trailing_spaces                 never
sync_to_monitor                       yes
url_prefixes                          http https file ftp
url_style                             curly
visual_bell_duration                  0
# }}}
